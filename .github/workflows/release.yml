name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run --no-project --python 3.12 --with pytest --with "textual>=1.0" python -m pytest -q tests
      - name: Build hangdoctor.exe
        run: uv run --no-project --python 3.12 --with pyinstaller --with "textual>=1.0" pyinstaller --noconfirm --onefile --console --name hangdoctor --paths src --collect-all textual --collect-submodules rich --distpath dist packaging/entry.py
      - name: Smoke test
        run: dist/hangdoctor.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: hangdoctor
          path: dist/hangdoctor.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hangdoctor.exe
